<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>티켓팅 API 테스트</title>
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 20px auto; padding: 0 16px; }
  section { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  h2 { margin-top: 0; font-size: 16px; }
  input { display: block; margin: 4px 0; padding: 4px; width: 260px; }
  button { margin: 4px 4px 4px 0; padding: 6px 10px; cursor: pointer; }
  pre { background: #f5f5f5; padding: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 260px; }
</style>
</head>
<body>

<h1>티켓팅 API 테스트 페이지</h1>
<p>API 서버: <code>http://localhost:3000</code> (백엔드를 <code>npm run start:dev</code>로 먼저 켜두세요)</p>

<section>
  <h2>현재 로그인 토큰</h2>
  <pre id="tokenBox">accessToken 없음</pre>
</section>

<section class="row">
  <div>
    <h2>회원가입</h2>
    <input id="signupEmail" placeholder="email" value="test@test.com" />
    <input id="signupPassword" type="password" placeholder="password" value="1234" />
    <button onclick="signup()">회원가입</button>
  </div>
  <div>
    <h2>로그인</h2>
    <input id="loginEmail" placeholder="email" value="test@test.com" />
    <input id="loginPassword" type="password" placeholder="password" value="1234" />
    <button onclick="login()">로그인</button>
  </div>
</section>

<section class="row">
  <div>
    <h2>공연 등록 (ADMIN만 가능)</h2>
    <input id="concertTitle" placeholder="title" value="가을 콘서트" />
    <input id="concertVenue" placeholder="venue" value="올림픽공원" />
    <input id="concertDate" placeholder="performanceDate (예: 2026-11-01T19:00:00)" value="2026-11-01T19:00:00" />
    <button onclick="createConcert()">공연 등록</button>
  </div>
  <div>
    <h2>공연 목록/상세</h2>
    <button onclick="listConcerts()">공연 목록 조회</button>
    <input id="concertIdView" placeholder="concertId" />
    <button onclick="getConcert()">공연 상세 조회</button>
  </div>
</section>

<section class="row">
  <div>
    <h2>좌석</h2>
    <input id="seatConcertId" placeholder="concertId" />
    <button onclick="listSeats()">좌석 목록 조회</button>
    <input id="seatId" placeholder="seatId" />
    <button onclick="holdSeat()">좌석 선점</button>
    <button onclick="cancelHoldSeat()">선점 취소</button>
  </div>
  <div>
    <h2>예매</h2>
    <input id="resConcertId" placeholder="concertId" />
    <input id="resSeatId" placeholder="seatId" />
    <button onclick="createReservation()">예매 생성 (PENDING)</button>
    <input id="resId" placeholder="reservationId" />
    <button onclick="confirmReservation()">예매 확정</button>
    <button onclick="cancelReservation()">예매 취소</button>
    <button onclick="myReservations()">내 예매 목록</button>
  </div>
</section>

<section>
  <h2>결제 (Mock)</h2>
  <input id="payResId" placeholder="reservationId" />
  <input id="payAmount" placeholder="amount" value="50000" />
  <button onclick="createPayment()">결제 생성</button>
  <input id="payResIdView" placeholder="reservationId" />
  <button onclick="getPayment()">결제 상태 조회</button>
</section>

<section>
  <h2>응답 결과</h2>
  <pre id="result">여기에 API 응답이 표시됩니다</pre>
</section>

<script>
const API = 'http://localhost:3000';
let accessToken = '';
let refreshToken = '';

function show(data) {
  document.getElementById('result').textContent = JSON.stringify(data, null, 2);
}

function updateTokenBox() {
  document.getElementById('tokenBox').textContent = accessToken
    ? 'accessToken: ' + accessToken
    : 'accessToken 없음';
}

async function api(method, path, body, auth = false) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth && accessToken) headers['Authorization'] = 'Bearer ' + accessToken;

  const res = await fetch(API + path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => null);
  show(data);
  return data;
}

function signup() {
  return api('POST', '/auth/signup', {
    email: document.getElementById('signupEmail').value,
    password: document.getElementById('signupPassword').value,
  });
}

async function login() {
  const data = await api('POST', '/auth/login', {
    email: document.getElementById('loginEmail').value,
    password: document.getElementById('loginPassword').value,
  });
  if (data && data.accessToken) {
    accessToken = data.accessToken;
    refreshToken = data.refreshToken;
    updateTokenBox();
  }
}

function createConcert() {
  return api('POST', '/concerts', {
    title: document.getElementById('concertTitle').value,
    venue: document.getElementById('concertVenue').value,
    performanceDate: document.getElementById('concertDate').value,
  }, true);
}

function listConcerts() {
  return api('GET', '/concerts');
}

function getConcert() {
  return api('GET', `/concerts/${document.getElementById('concertIdView').value}`);
}

function listSeats() {
  return api('GET', `/concerts/${document.getElementById('seatConcertId').value}/seats`);
}

function holdSeat() {
  return api('POST', `/seats/${document.getElementById('seatId').value}/hold`, null, true);
}

function cancelHoldSeat() {
  return api('DELETE', `/seats/${document.getElementById('seatId').value}/hold`, null, true);
}

function createReservation() {
  return api('POST', '/reservations', {
    concertId: Number(document.getElementById('resConcertId').value),
    seatId: Number(document.getElementById('resSeatId').value),
  }, true);
}

function confirmReservation() {
  return api('POST', `/reservations/${document.getElementById('resId').value}/confirm`, null, true);
}

function cancelReservation() {
  return api('POST', `/reservations/${document.getElementById('resId').value}/cancel`, null, true);
}

function myReservations() {
  return api('GET', '/reservations/my', null, true);
}

function createPayment() {
  return api('POST', '/payments', {
    reservationId: Number(document.getElementById('payResId').value),
    amount: Number(document.getElementById('payAmount').value),
  }, true);
}

function getPayment() {
  return api('GET', `/payments/${document.getElementById('payResIdView').value}`, null, true);
}
</script>

</body>
</html>
